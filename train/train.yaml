# AI Runtime workload for the demo's training step, plus the demo's own
# configuration under `parameters`. From the repo root:
#   databricks air run --file train/train.yaml --dry-run   # validate only
#   databricks air run --file train/train.yaml --watch     # submit + stream logs
# Field reference (unknown keys are rejected):
# https://docs.databricks.com/aws/en/machine-learning/ai-runtime/cli/yaml-config

# ---------------------------------------------------------------------------
# Required AI Runtime fields
# ---------------------------------------------------------------------------

# MLflow experiment shared by CLI and notebook runs. Also the Jobs task key:
# letters, digits, - and _ only, at most 100 characters.
experiment_name: qwen35_4b_sft_training

# One 8xH100 node. Validate cheaply first with
#   --override compute.accelerator_type=GPU_1xA10 --override compute.num_accelerators=1
compute:
  accelerator_type: GPU_8xH100
  num_accelerators: 8

# Runs once per node. torchrun starts one DDP process per GPU; a single process
# holding every GPU would fall back to nn.DataParallel, which Qwen3.5's Gated
# DeltaNet layers cannot run. --standalone fits one node; multi-node runs need
# the rendezvous flags AI Runtime sets ($NUM_NODES, $NODE_RANK,
# $LOCAL_WORLD_SIZE, $MASTER_ADDR, $MASTER_PORT) instead.
command: torchrun --standalone --nproc_per_node=gpu $CODE_SOURCE_PATH/train.py

# ---------------------------------------------------------------------------
# Optional AI Runtime fields
# ---------------------------------------------------------------------------
# Custom image defined in train/docker/ and pushed to Unity Catalog Artifact
# train/requirements.txt's packages.
environment:
  unity_catalog_image: ssa_team_sandbox_classic_catalog.air.air_demo_training:v1

# Uploads this file's directory (train/) with every run — tracked files plus
# untracked files .gitignore doesn't exclude — as $CODE_SOURCE_PATH, so code
# changes need no image rebuild.
code_source:
  type: snapshot
  snapshot:
    root_path: .

# Workspace folder holding the experiment (created if missing), so runs land in
# /Users/ben.doan@databricks.com/qwen35_4b_sft_training. The runner notebook
# resolves the same path. Remove to use the submitting user's home folder.
mlflow_experiment_directory: /Workspace/Users/ben.doan@databricks.com

# Fail fast. The default is 3 retries, each a fresh workload and a new MLflow
# run; raise it (--override max_retries=2) for long unattended runs.
max_retries: 0

# ---------------------------------------------------------------------------
# Demo configuration
# ---------------------------------------------------------------------------
# Free-form. The CLI writes `parameters` to $HYPERPARAMETERS_PATH, which
# train.py reads, so `--override parameters.training_config.<key>=VALUE`
# reaches the script. The runner notebook reads the same section from this file.
parameters:
  training_config:
    catalog: ssa_team_sandbox_classic_catalog
    schema: air
    source_table: fraud_dataset
    sft_table: fraud_sft_dataset
    # Volume holding the parquet export of the SFT table (written by setup);
    # must match setup.yaml's sft_volume.
    sft_volume: training_data
    checkpoint_volume: checkpoints
    uc_model_name: qwen35_4b_finetuned
    endpoint_name: qwen35_4b_finetuned_lora

    model_name: Qwen/Qwen3.5-4B
    max_seq_length: 2048
    max_steps: 10
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 4
    learning_rate: 2e-4
    # Fraction of each rank's shard slice to train on (1.0 = every row), used by
    # BOTH launchers: the runner notebook passes this value into
    # run_rank_training(), and CLI runs can change it per run with
    # `--override parameters.training_config.training_sample_fraction=...`.
    training_sample_fraction: 0.001
    register_model: true
    deploy_endpoint: true
    serving_workload_type: GPU_MEDIUM
    # workload_size sets a FIXED replica count (no autoscaling during beta) —
    # size for peak traffic. Measured on this workload: one A10 replica
    # sustains ~150 QPS; requests beyond provisioned capacity get 429s.
    # For the full 10K QPS demo, pair Large with GPU_XLARGE (H100,
    # us-west-2 + beta enrollment required).
    serving_workload_size: Large
    serving_scale_to_zero: false
    served_model_name: qwen35_4b_finetuned
    vllm_dtype: float16
    vllm_max_model_len: 2048
    vllm_gpu_memory_utilization: 0.9
    seed: 3407
